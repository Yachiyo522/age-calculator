<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>支払い終了年齢計算</title>
<style>
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#16213a; --muted:#8793ad; --sub:#5b6882; --line:#c9d1e0; --accent:#2b4fd8; --band:rgba(43,79,216,.09);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1527; --surface:#182037; --ink:#e8ecf7; --muted:#6a7798; --sub:#93a0bf; --line:#2b3655; --accent:#8fa8ff; --band:rgba(143,168,255,.14);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1527; --surface:#182037; --ink:#e8ecf7; --muted:#6a7798; --sub:#93a0bf; --line:#2b3655; --accent:#8fa8ff; --band:rgba(143,168,255,.14);
  color-scheme: dark;
}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  display:flex; justify-content:center; padding:32px 20px;
}
main{width:100%; max-width:30rem}
h1{font-size:1.1rem; font-weight:600; margin:0 0 4px; color:var(--sub); letter-spacing:.04em}
.today{margin:0 0 20px; font-size:.85rem; color:var(--muted)}
.lead{font-size:.9rem; color:var(--sub); margin:0 0 8px}
[hidden]{display:none !important}

.drums{
  position:relative; display:grid; grid-template-columns:1.5fr 1fr 1fr; gap:4px;
  background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:0 8px; overflow:hidden;
}
.drums::after{
  content:""; position:absolute; left:8px; right:8px; top:88px; height:44px; pointer-events:none;
  background:var(--band); border-radius:10px;
}
.wheel{
  height:220px; overflow-y:auto; scroll-snap-type:y mandatory; padding:88px 0; margin:0; list-style:none;
  scrollbar-width:none; overscroll-behavior:contain; outline:none; position:relative;
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 32%, #000 68%, transparent 100%);
          mask-image:linear-gradient(to bottom, transparent 0, #000 32%, #000 68%, transparent 100%);
}
.wheel::-webkit-scrollbar{display:none}
.wheel:focus-visible{box-shadow:inset 0 0 0 3px var(--accent); border-radius:10px}
.wheel li{
  height:44px; display:flex; align-items:center; justify-content:center; scroll-snap-align:center;
  font-size:1.2rem; color:var(--muted); cursor:pointer; user-select:none; font-variant-numeric:tabular-nums;
  transition:color .15s, font-size .15s;
}
.wheel li.on{color:var(--ink); font-weight:700; font-size:1.4rem}
.wheel#wy li{flex-direction:column; gap:1px; line-height:1.15; font-size:1.1rem}
.wheel#wy li.on{font-size:1.3rem}
.wheel#wy b{font-weight:inherit}
.wheel#wy small{font-size:.72rem; font-weight:400}

.result{
  margin-top:24px; padding:28px 22px 24px; background:var(--surface);
  border:1.5px solid var(--line); border-radius:14px;
}
.big{
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 10px; line-height:1;
}
.big .n{font-size:clamp(3.6rem, 18vw, 5.6rem); font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.big .u{font-size:1.4rem; color:var(--sub); margin-right:10px}
.sub{margin:22px 0 0; font-size:.95rem; color:var(--sub); line-height:1.7}
.sub strong{color:var(--ink); font-weight:600}
.track{margin-top:22px}
.track-head{display:flex; justify-content:space-between; font-size:.8rem; color:var(--sub); margin-bottom:8px}
.bar{height:10px; border-radius:5px; background:var(--bg); border:1px solid var(--line); overflow:hidden}
.bar i{display:block; height:100%; width:0; background:var(--accent); border-radius:5px; transition:width .5s ease}

.fh{margin:24px 0 0; padding-top:18px; border-top:1px solid var(--line); font-size:.85rem; font-weight:600; color:var(--sub)}
.future{list-style:none; margin:8px 0 0; padding:0}
.future li{display:grid; grid-template-columns:5.2rem 1fr auto; align-items:baseline; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); font-size:.85rem; color:var(--sub); white-space:nowrap}
.future li:last-child{border-bottom:0; padding-bottom:0}
.future .d{color:var(--ink); font-variant-numeric:tabular-nums}
.future b{font-size:1.1rem; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums}

.set{margin-top:22px; padding-top:18px; border-top:1px solid var(--line); display:grid; gap:14px}
.set label{display:grid; gap:6px; font-size:.8rem; color:var(--sub)}
.set select,.set input{
  font:inherit; font-size:1rem; width:100%; padding:10px 12px; color:var(--ink);
  background:var(--bg); border:1.5px solid var(--line); border-radius:10px;
}
.set select:focus-visible,.set input:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.set small{color:var(--muted)}
.future b.over{color:#c62828}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .future b.over{color:#ff8a80}}
:root[data-theme="dark"] .future b.over{color:#ff8a80}
@media (prefers-reduced-motion: reduce){.bar i,.wheel li{transition:none}}
</style>
</head>
<body>
<main>
  <h1>支払い終了年齢計算</h1>
  <p class="today" id="today"></p>
  <p class="lead" id="lead">誕生日を選択</p>
  <div class="drums" role="group" aria-labelledby="lead">
    <ul class="wheel" id="wy" tabindex="0" role="listbox" aria-label="年"></ul>
    <ul class="wheel" id="wm" tabindex="0" role="listbox" aria-label="月"></ul>
    <ul class="wheel" id="wd" tabindex="0" role="listbox" aria-label="日"></ul>
  </div>

  <section class="result" id="result" aria-live="polite">
    <div class="big">
      <span class="n" id="y">0</span><span class="u">歳</span>
      <span class="n" id="m">0</span><span class="u">ヶ月</span>
    </div>
    <p class="sub" id="sub"></p>
    <h2 class="fh" id="fh">これからの年齢</h2>
    <ul class="future" id="future"></ul>

    <div class="set">
      <label for="basem">起算月
        <select id="basem">
          <option value="1">1ヶ月後(翌月)</option>
          <option value="2">2ヶ月後</option>
          <option value="3">3ヶ月後</option>
        </select>
        <small>起算日は選んだ月の27日です</small>
      </label>
      <label for="offs">何ヶ月後を表示するか
        <input id="offs" type="text" inputmode="numeric" autocomplete="off" placeholder="6, 12, 18, 20, 24, 36">
        <small>カンマ区切りで最大10件(0は起算日)</small>
      </label>
    </div>
  </section>
</main>

<script>
(function(){
  var H = 44, Y0 = 1950;
  var DEF_OFFS = [6, 12, 18, 20, 24, 36];
  var $ = function(id){return document.getElementById(id)};
  function startOfToday(){ var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  var Y1 = 2020;

  function store(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
  function load(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }

  // ---- ドラム ----
  function Wheel(el, unit, onChange, fmt){
    fmt = fmt || function(v){ return v + unit; };
    var self = this; self.el = el; self.idx = 0; self.n = 0; self.values = []; var timer = null;
    self.set = function(values, idx){
      self.values = values; self.n = values.length;
      el.innerHTML = "";
      values.forEach(function(v, i){
        var li = document.createElement("li");
        li.innerHTML = fmt(v); li.setAttribute("role","option");
        li.addEventListener("click", function(){ self.go(i, true); });
        el.appendChild(li);
      });
      self.idx = Math.max(0, Math.min(self.n-1, idx));
      el.scrollTop = self.idx * H;
      mark();
    };
    self.go = function(i, smooth){
      i = Math.max(0, Math.min(self.n-1, i));
      el.scrollTo({top: i*H, behavior: smooth ? "smooth" : "auto"});
    };
    self.value = function(){ return self.values[self.idx]; };
    function mark(){
      var k = Math.max(0, Math.min(self.n-1, Math.round(el.scrollTop / H)));
      var items = el.children;
      for(var i=0;i<items.length;i++){ items[i].classList.toggle("on", i===k); items[i].setAttribute("aria-selected", i===k); }
      return k;
    }
    el.addEventListener("scroll", function(){
      mark();
      clearTimeout(timer);
      timer = setTimeout(function(){
        var k = mark();
        if(k !== self.idx){ self.idx = k; onChange(); }
      }, 90);
    });
    el.addEventListener("keydown", function(e){
      if(e.key === "ArrowDown"){ e.preventDefault(); self.go(self.idx+1, true); }
      if(e.key === "ArrowUp"){ e.preventDefault(); self.go(self.idx-1, true); }
    });
  }

  function range(a, b){ var r=[]; for(var i=a;i<=b;i++) r.push(i); return r; }
  function dim(y, m){ return new Date(y, m, 0).getDate(); }

  function era(y){
    if(y === 2019) return "平成31・令和元年";
    if(y > 2019) return "令和" + (y-2018) + "年";
    if(y === 1989) return "昭和64・平成元年";
    if(y > 1989) return "平成" + (y-1988) + "年";
    if(y === 1926) return "大正15・昭和元年";
    if(y > 1926) return "昭和" + (y-1925) + "年";
    if(y === 1912) return "明治45・大正元年";
    if(y > 1912) return "大正" + (y-1911) + "年";
    return "明治" + (y-1867) + "年";
  }

  var wy = new Wheel($("wy"), "年", onYM, function(v){ return "<b>" + v + "年</b><small>" + era(v) + "</small>"; });
  var wm = new Wheel($("wm"), "月", onYM);
  var wd = new Wheel($("wd"), "日", render);

  function onYM(){
    var n = dim(wy.value(), wm.value());
    if(n !== wd.n){ wd.set(range(1, n), Math.min(wd.idx, n-1)); }
    render();
  }

  // ---- 設定 ----
  var offsIn = $("offs");
  var baseM = $("basem");
  var bmSaved = +load("basem");
  if(bmSaved >= 1 && bmSaved <= 3){ baseM.value = String(bmSaved); }
  baseM.addEventListener("change", function(){ store("basem", baseM.value); render(); });
  
  
  
  

  function parseOffs(s){
    var parts = String(s || "").split(/[,\s、，]+/).filter(Boolean);
    var nums = parts.map(Number);
    var ok = nums.length > 0 && nums.every(function(n){ return isFinite(n) && n % 1 === 0 && n >= 0 && n <= 1200; });
    return ok ? nums.slice(0, 10) : null;
  }
  var saved = parseOffs(load("offs"));
  var offs = saved || DEF_OFFS.slice();
  offsIn.value = offs.join(", ");

  
  offsIn.addEventListener("change", function(){
    var p = parseOffs(offsIn.value);
    offs = p || DEF_OFFS.slice();
    offsIn.value = offs.join(", ");
    store("offs", offs.join(","));
    render();
  });

  // ---- 計算 ----
  function addMonths(d, n){
    var y = d.getFullYear(), m = d.getMonth()+n;
    var last = new Date(y, m+1, 0).getDate();
    return new Date(y, m, Math.min(d.getDate(), last));
  }
  function dayDiff(a, b){
    return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate()) - Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000);
  }
  function monthsAt(b, d){
    if(d < b) return -1;
    var t = (d.getFullYear()-b.getFullYear())*12 + (d.getMonth()-b.getMonth());
    if(addMonths(b, t) > d) t--;
    return t;
  }
  function ageText(t){ return t < 0 ? "誕生前" : Math.floor(t/12) + "歳" + (t % 12) + "ヶ月"; }

  var lastKey = "";
  function render(){
    var today = startOfToday();
    lastKey = today.getTime();
    $("today").textContent = "今日は" + today.getFullYear() + "年" + (today.getMonth()+1) + "月" + today.getDate() + "日";

    var b = new Date(wy.value(), wm.value()-1, wd.value());
    var total = monthsAt(b, today);

    if(total < 0){
      $("y").textContent = 0; $("m").textContent = 0;
      $("sub").textContent = "選んだ日付は今日より後です。";
      
    } else {
      var years = Math.floor(total/12), months = total % 12;
      
      
      
      $("y").textContent = years;
      $("m").textContent = months;
      $("sub").innerHTML = "生まれてから通算 <strong>" + total.toLocaleString("ja-JP") + "ヶ月</strong>(<strong>" + dayDiff(b, today).toLocaleString("ja-JP") + "日</strong>)です。";
        
      
      
      
      
    }

    // 起算日
    var mode = "27", base, atK;
    if(mode === "t"){
      base = today;
      atK = function(k){ return addMonths(today, k); };
    } else {
      var day = +mode;
      var ref = new Date(today.getFullYear(), today.getMonth() + (+baseM.value), 1);
      atK = function(k){
        var y = ref.getFullYear(), m = ref.getMonth()+k;
        return new Date(y, m, Math.min(day, new Date(y, m+1, 0).getDate()));
      };
      base = atK(0);
    }
    $("fh").textContent = "起算日 " + base.getFullYear() + "年" + (base.getMonth()+1) + "月" + base.getDate() + "日 からの年齢";

    var h = "";
    offs.forEach(function(k){
      var dt = atK(k), t = monthsAt(b, dt);
      h += "<li><span>" + (k === 0 ? "起算日" : k + "ヶ月後") + "</span><span class=\"d\">" + dt.getFullYear() + "年" + (dt.getMonth()+1) + "月</span><b" + (t >= 912 ? ' class="over"' : "") + ">" + ageText(t) + "</b></li>";
    });
    $("future").innerHTML = h;

    store("bd2", wy.value() + "-" + wm.value() + "-" + wd.value());
  }

  // ---- 初期化 ----
  var y = Y1 - 2, m = 1, d = 1;
  var s = load("bd2");
  if(s){
    var p = s.split("-").map(Number);
    if(p.length === 3 && p[0] >= Y0 && p[0] <= Y1 && p[1] >= 1 && p[1] <= 12 && p[2] >= 1 && p[2] <= dim(p[0], p[1])){ y = p[0]; m = p[1]; d = p[2]; }
  }
  wy.set(range(Y0, Y1), y - Y0);
  wm.set(range(1, 12), m - 1);
  wd.set(range(1, dim(y, m)), d - 1);
  render();

  // 日付が変わったら(開きっぱなしでも)自動で更新
  function refreshIfNewDay(){ if(startOfToday().getTime() !== lastKey) render(); }
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) refreshIfNewDay(); });
  window.addEventListener("focus", refreshIfNewDay);
  setInterval(refreshIfNewDay, 60000);
})();
</script>
</body>
</html>
